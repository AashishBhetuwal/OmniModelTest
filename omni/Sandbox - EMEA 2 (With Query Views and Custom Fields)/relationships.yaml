- join_from_view: superstore_data_analytics__orders
  join_to_view: superstore_data_analytics__customers
  join_type: always_left
  on_sql: ${superstore_data_analytics__orders.customer_id} =
    ${superstore_data_analytics__customers.id}
  relationship_type: assumed_many_to_one

- join_from_view: superstore_data_analytics__orders
  join_to_view: superstore_data_analytics__products
  join_type: always_left
  on_sql: ${superstore_data_analytics__orders.product_id} =
    ${superstore_data_analytics__products.id}
  relationship_type: assumed_many_to_one

- join_from_view: superstore__orders
  join_to_view: superstore__customers
  join_type: always_left
  on_sql: ${superstore__orders.customer_id} = ${superstore__customers.id}
  relationship_type: many_to_one

- join_from_view: superstore__orders
  join_to_view: superstore__products
  join_type: always_left
  on_sql: ${superstore__orders.product_id} = ${superstore__products.id}
  relationship_type: many_to_one

- join_from_view: superstore__orders
  join_to_view: superstore__returns
  join_type: always_left
  on_sql: ${superstore__orders.order_id} = ${superstore__returns.order_id}
  relationship_type: one_to_one
